[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-feedback"
version = "0.1.0"
description = "Framework-agnostic feedback loop around LLM invocation callables."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SyedZaheen" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/scepticalsceptile/agent-feedback"
Repository = "https://github.com/scepticalsceptile/agent-feedback"
Issues = "https://github.com/scepticalsceptile/agent-feedback/issues"
Documentation = "https://github.com/scepticalsceptile/agent-feedback/blob/main/docs/Guides/README.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_feedback"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/pyproject.toml",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
check_untyped_defs = true
files = ["src", "tests"]
python_version = "3.10"
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true
